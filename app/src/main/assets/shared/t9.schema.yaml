# Rime schema
# encoding: utf-8


# 适配了仓输入法 [Hamster](https://github.com/imfuxiao/Hamster/) 九宫格布局。
# 参考于仓老师 [morse.hsiao](https://github.com/imfuxiao) 的示例
#
# 可选，支持英文：
# 1. 解开 `engine/translators` 下的注释
# 2. 将 `tools/Hamster/melt_eng.custom.yaml` 里的文件拷贝至配置目录，该补丁转写了英文的拼写规则到九宫格；


__include: rime_mint.schema.yaml:/


schema:
  schema_id: t9
  name: 仓九宫格-全拼输入
  version: "24.04.25"
  author:
    - Dvel
    - '[morse.hsiao](https://github.com/imfuxiao)'
    - Mintimate
  description: |
    九宫格 for 仓输入法
  dependencies:
    - melt_eng  # 英文输入，作为次翻译器挂载到拼音方案
    - melt_eng_t9  # 英文的九宫格版（字母映射成数字），本仓库新增
    - hotwords_t9  # 九宫格热词词典（hotwords.txt 生成），本仓库新增
    - hotwords_t9_user  # 手机上「热词」页面手动加的词（fork 版 Trime 部署前生成），本仓库新增


engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - table_translator@hotwords_t9_user                  # 手动热词：权重最高
    - table_translator@hotwords_t9                       # 仓库热词：排在中文前面
    - table_translator@melt_eng_t9                       # 英文 T9：数字键打英文，权重低于中文
    - lua_translator@*shijian                            # 时间、日期、星期、月份、问候、节气、节日，N模式
    - table_translator@custom_phrase                     # 自定义短语 custom_phrase_t9.txt
    # - table_translator@melt_eng                        # 英文输入
  filters:
    - simplifier@emoji_suggestion
    # simplifier@transcription_cc 已删：简繁不用，APK 也不再内置 s2t.json，别从上游抄回来
    - lua_filter@*english_boost_filter    # 中文拼不出整词时让覆盖整段输入的英文优先（本仓库新增）
    - uniquifier                          # 去重

# 开关：不写的话会从 rime_mint.schema.yaml 继承带 transcription（简繁）的那份。
# 照 rime_mint 原样抄，只删了简繁一项；简繁不用，别从上游抄回来
switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]
  - name: emoji_suggestion
    states: [ "😣️","😁️"]
    reset: 1
  - name: full_shape
    states: [ 半角, 全角 ]
    reset: 0
  - name: tone_display                  #开启后在输入编码的位置实时转换为带声调全拼，不开启则采用系统配置，影响的是preedit_format,归属：super_preedit.lua
    states: [ 声杳, 声起 ]
    reset: 0
  - name: ascii_punct
    states: [ "。，" , "．，" ]
    reset: 0

# 笔画、五笔98 反查都没挂（APK 也不再内置 stroke），把从 rime_mint 继承来的识别规则置空，
# 免得 Ui / Uw 开头的输入被 matcher 标成反查段却没有翻译器接
recognizer:
  patterns:
    stroke: ""
    wubi98_mint: ""

translator:
  prism: t9
  spelling_hints: 100
  comment_format: []

#shijian:仅仅作为提示使用，编码已经写死，引导键可以在key_binder下修改前缀
#时间：osj 或者 /sj
#日期：orq 或者 /rq
#农历：onl 或者 /nl
#星期：oxq 或者 /xq
#今年第几周：oww 或者 /ww
#节气：ojq 或者 /jq
#日期+时间：odt 或者 /dt
#时间戳：ott 或者 /tt
#大写N日期：N20250315 或者N0312不带年
#节日：ojr 或者 /jr
#问候模板：/day 或者 oday
# 通用日期时间格式化函数（供 /rq、/sj、/dt、N0101、N20150101 场景复用）
# 支持转义：
#   \X       —— 转义单个字符 X，按字面量输出（如 \Y \m \H 等）
#   [[...]]  —— 区块整体按字面量输出
#
# 约定占位符：
# 【日期】
#   Y  四位年份           0000-9999  例：2025
#   y  两位年份           00-99      例：25
#   m  月（前导零）        01-12      例：02
#   n  月（不带前导零）     1-12       例：2
#   d  日（前导零）        01-31      例：09
#   j  日（不带前导零）     1-31       例：9
#
# 【时间】
#   H  24小时（前导零）   00-23      例：08
#   G  24小时（不带零）   0-23       例：8
#   I  12小时（前导零）   01-12      例：08
#   l  12小时（不带零）   1-12       例：8   （注意是小写 L）
#   M  分钟（前导零）     00-59      例：05
#   S  秒（前导零）       00-59      例：09
#   p  am/pm（小写）     am / pm
#   P  AM/PM（大写）     AM / PM
# 【时区】
#   O  带冒号格式        +08:00、-04:30、+05:45
#   o  不带冒号格式      +0800、-0430、+0545
date_formats:
  - "Y年m月d日"
  - "Y-m-d"
  - "Y/m/d"
  - "Y.m.d"
  - "Ymd"
  - "Y年n月j日"
  - "y年n月j日"
  - "n月j日"
time_formats:
  - "H:M"
  - "H点M分"
  - "H:M:S"
  - "H时M分S秒"
  - "下午I:M"
  - "I:M P"
datetime_formats:
  - "Y-m-d H:M:S"
  - "Y-m-dTH:M:S O"
  - "YmdHMS"
  - "Y年m月d日 H点M分"
  - "y/m/d I:M p"

# 自定义短语：custom_phrase_t9.txt
# ⚠️ 编码要用数字
hotwords_t9:
  dictionary: hotwords_t9
  prism: hotwords_t9
  enable_sentence: false
  enable_completion: false
  initial_quality: 99

# 手机上手动加的热词：hotwords_t9_user.dict.yaml 由 fork 版 Trime 在部署前生成，仓库里只放一份空的占位
hotwords_t9_user:
  dictionary: hotwords_t9_user
  prism: hotwords_t9_user
  enable_sentence: false
  enable_completion: false
  initial_quality: 100

melt_eng_t9:
  dictionary: melt_eng
  prism: melt_eng_t9
  enable_sentence: false
  enable_completion: false
  initial_quality: 0.8

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase_t9
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 99


# 九宫格 1 键上的符号序列
punctuator:
  half_shape:
    "1": [1, "@", ".", "/", ":", "_", "-", "#"]
    "@": [1, "@", ！, ：, 、, ……, ～]
    "#": [0, "#", "$", "%", "^", "&", "*", "(", ")"]


# 输入时按 1 可以分词
key_binder:
  bindings:
    - { when: has_menu, accept: at, send: apostrophe }


speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA987654321
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA987654321
  algebra:
    # ### 万象词库的拼音带声调，先去掉声调（薄荷 rime_mint.schema.yaml 里同样的四条；
    # ### 这份 t9 方案（24.04.25）比词库（2025.07）旧，缺了这几条会导致带声调的词全部匹配不到）
    - xlit/āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜü/aaaaooooeeeeiiiiuuuuvvvvv/
    - xform/^ng$/eng/
    - xform/ńg|ňg|ǹg/eng/
    - xform/ń|ň|ǹ/en/
    # ### 超级简拼
    - abbrev/^([a-z]).+$/$1/ # 超级简拼
    - abbrev/^([zcs]h).+$/$1/ # 超级简拼中，zh ch sh 视为整体（ch'sh → 城市），而不是像这样分开（c'h's'h → 吃好睡好）。
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/
    # ### 九宫格数字映射
    - derive/[abc]/2/
    - derive/[def]/3/
    - derive/[hgi]/4/
    - derive/[jkl]/5/
    - derive/[omn]/6/
    - derive/[pqrs]/7/
    - derive/[tuv]/8/
    - derive/[wxyz]/9/
