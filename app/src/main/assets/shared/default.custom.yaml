# 固定方案列表：只有薄荷拼音-小鹤混输。
#
# Trime 首次运行会在用户目录里自己生成一份 default.custom.yaml，把 schema_list 补丁成
# 朙月拼音等内置方案；而且每次部署会先从外部目录导入文件、丢掉 user.yaml，
# 于是“上次选的方案”记不住，总是回到列表第一个（朙月）。
# 把这个文件放进外部目录，每次部署导入时就会覆盖掉 Trime 生成的那份。
#
# 注意：不要再在 Trime 的「输入方案」页面勾选其他方案，那会重写这个文件。
patch:
  schema_list:
    - schema: rime_mint_flypy
    - schema: t9              # 薄荷九宫格，横屏时由 fork 版 Trime 自动切换（设置 → 键盘 → 横屏时使用的输入方案）
